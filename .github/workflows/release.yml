name: Create Release

# Triggered by the tag pushed from release-trigger.yml.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building release for $VERSION"

      - name: Check release does not already exist
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        if: steps.check.outputs.exists == 'false'
        id: notes
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${TAG#v}"

          # Previous tag for commit range
          PREVIOUS_TAG=$(git tag -l 'v*' --sort=-version:refname | grep -v "^${TAG}$" | head -n 1)

          # Commits since previous tag (fall back to last 20 if first release)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            COMMITS=$(git log --no-merges --pretty=format:"- %s" "$PREVIOUS_TAG"..HEAD)
          else
            COMMITS=$(git log --no-merges --pretty=format:"- %s" HEAD~20..HEAD 2>/dev/null \
                      || git log --no-merges --pretty=format:"- %s" HEAD)
          fi

          # Extract matching CHANGELOG section (between this version header and the next)
          CHANGELOG_SECTION=$(awk \
            "/^## \[${VERSION}\]/{found=1; next} found && /^## /{exit} found{print}" \
            kit/CHANGELOG.md || true)

          cat > release_notes.md << 'NOTES_EOF'
          ## Install

          ```bash
          npx craft-kit [target-dir]
          ```

          NOTES_EOF

          if [[ -n "$CHANGELOG_SECTION" ]]; then
            echo "" >> release_notes.md
            echo "## Release notes" >> release_notes.md
            echo "" >> release_notes.md
            echo "$CHANGELOG_SECTION" >> release_notes.md
          else
            echo "" >> release_notes.md
            echo "## What's Changed" >> release_notes.md
            echo "" >> release_notes.md
            echo "$COMMITS" >> release_notes.md
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" \
            --title "craft-kit ${TAG}" \
            --notes-file release_notes.md
