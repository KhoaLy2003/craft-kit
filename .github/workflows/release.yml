name: Create Release

# Triggered by the tag pushed from release-trigger.yml.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building release for $VERSION"

      - name: Check release does not already exist
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        if: steps.check.outputs.exists == 'false'
        id: notes
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"

          cat > release_notes.md << 'NOTES_EOF'
          ## Install

          ```bash
          npx github:KhoaLy2003/craft-kit [target-dir]
          ```

          NOTES_EOF

          if [[ -s RELEASE_NOTES.md ]]; then
            echo "" >> release_notes.md
            cat RELEASE_NOTES.md >> release_notes.md
          else
            # Fallback: commit messages since previous tag
            PREVIOUS_TAG=$(git tag -l 'v*' --sort=-version:refname | grep -v "^${TAG}$" | head -n 1 || true)
            if [[ -n "$PREVIOUS_TAG" ]]; then
              COMMITS=$(git log --no-merges --pretty=format:"- %s" "$PREVIOUS_TAG"..HEAD)
            else
              COMMITS=$(git log --no-merges --pretty=format:"- %s" HEAD~20..HEAD 2>/dev/null \
                        || git log --no-merges --pretty=format:"- %s" HEAD)
            fi
            echo "" >> release_notes.md
            echo "## What's Changed" >> release_notes.md
            echo "" >> release_notes.md
            echo "$COMMITS" >> release_notes.md
          fi


      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" \
            --title "craft-kit ${TAG}" \
            --notes-file release_notes.md
