name: Validate CLI Installer

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs for the same ref when a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["18", "20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No npm install — the test suite has zero external dependencies.
      # node:test, node:assert, and node:child_process are all built-in.

      - name: Run tests
        run: node --test tests/cli.test.mjs
