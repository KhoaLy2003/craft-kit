name: Validate CLI Installer

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs for the same ref when a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["18", "20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.2.0
        with:
          node-version: ${{ matrix.node }}

      # No npm install — the test suite has zero external dependencies.
      # node:test, node:assert, and node:child_process are all built-in.

      - name: Run tests
        run: node --test tests/cli.test.mjs
