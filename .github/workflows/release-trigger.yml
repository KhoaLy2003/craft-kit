name: Release Trigger

# Bump version, update CHANGELOG, push tag, open PR.
# Triggers release.yml via the pushed tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3 or v1.2.3). Leave empty to auto-increment patch.'
        required: false
        type: string
      summary:
        description: 'One-line release summary (e.g. "Stack catalog · Bug fix workflow hardening"). Appears at the top of the release notes.'
        required: false
        type: string

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Pushes to main and the tag use RELEASE_PAT (so release.yml fires on the tag push).

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.2.0
        with:
          node-version: "22"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Preflight (main only, notes written, CI green)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Error: release must be dispatched from main (got $GITHUB_REF)."
            exit 1
          fi

          NOTES=$(perl -0pe 's/<!--.*?-->//gs' RELEASE_NOTES.md | tr -d '[:space:]')
          if [[ -z "$NOTES" ]]; then
            echo "Error: RELEASE_NOTES.md has no content. Write the release notes and push them to main first."
            exit 1
          fi

          SHA=$(git rev-parse HEAD)
          # Skip this job's own check run (it is in progress by definition).
          BAD=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" --paginate \
            --jq '.check_runs[] | [.name, .status, .conclusion] | @tsv' \
            | awk -F'\t' -v job="$GITHUB_JOB" '$1 != job && !($2 == "completed" && ($3 == "success" || $3 == "skipped" || $3 == "neutral")) {n++} END{print n+0}')
          if [[ "$BAD" != "0" ]]; then
            echo "Error: $BAD check run(s) on $SHA are failing or still running. Wait for green CI on main."
            exit 1
          fi

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_VERSION" ]]; then
            # Strip optional v prefix
            VERSION="${INPUT_VERSION#v}"
            # Validate strict semver X.Y.Z
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Error: '$VERSION' is not valid semver (expected X.Y.Z)"
              exit 1
            fi
          else
            # Auto-increment patch from latest v* tag
            LATEST_TAG=$(git tag -l 'v*' --sort=-version:refname | head -n 1)
            if [[ -z "$LATEST_TAG" ]]; then
              LATEST_TAG="v0.0.0"
            fi
            echo "Latest tag: $LATEST_TAG"
            RAW="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$RAW"
            PATCH=$((PATCH + 1))
            VERSION="$MAJOR.$MINOR.$PATCH"
            echo "Auto-incremented version: $VERSION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check tag does not already exist
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Error: tag $TAG already exists."
            exit 1
          fi

      - name: Update package.json version
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version
          echo "Updated package.json to ${{ steps.version.outputs.version }}"

      - name: Update kit/CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SUMMARY: ${{ github.event.inputs.summary }}
        run: |
          set -euo pipefail
          export DATE=$(date +%Y-%m-%d)

          node - << 'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const content = fs.readFileSync('kit/CHANGELOG.md', 'utf8');

          const version = process.env.VERSION;
          const date = process.env.DATE;
          const summary = (process.env.SUMMARY || '').trim();

          // Extract body of [Unreleased] (between its header and the next ## [ block)
          const unreleasedMatch = content.match(/^## \[Unreleased\]\n([\s\S]*?)(?=^## \[)/m);
          let unreleasedBody = '';
          if (unreleasedMatch) {
            // Strip the leading --- separator and surrounding whitespace
            unreleasedBody = unreleasedMatch[1].replace(/^[ \t]*---[ \t]*\n/, '').trim();
          }

          // Build versioned entry
          let versionBlock = `## [${version}] - ${date}\n`;
          if (summary) versionBlock += `\n**Summary:** ${summary}\n`;
          if (unreleasedBody) versionBlock += `\n${unreleasedBody}\n`;

          // Replace the [Unreleased] block with: fresh [Unreleased] + new version block
          const replacement = `## [Unreleased]\n\n---\n\n${versionBlock}\n---\n\n`;
          const updated = content.replace(
            /^## \[Unreleased\][\s\S]*?(?=^## \[)/m,
            replacement
          );

          if (updated === content) {
            console.error('ERROR: [Unreleased] section not found in kit/CHANGELOG.md');
            process.exit(1);
          }

          fs.writeFileSync('kit/CHANGELOG.md', updated);
          console.log(`CHANGELOG: promoted [Unreleased] → [${version}] - ${date}`);

          // Verify extraction matches what release.yml awk expects
          const out = execSync(
            `awk "/^## \\\\[${version}\\\\]/{found=1; next} found && /^## /{exit} found{print}" kit/CHANGELOG.md`
          ).toString().trim();
          if (!out) {
            console.error(`ERROR: awk extraction for [${version}] produced empty output — release.yml would fall back to commits.`);
            process.exit(1);
          }
          console.log(`Extraction check passed (${out.split('\n').length} lines).`);
          EOF

      - name: Commit, tag, and push to main
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          # Reset RELEASE_NOTES.md in the same commit. release.yml reads the notes
          # from the commit before the tag, so they are not lost.
          cat > RELEASE_NOTES.md << 'RESET_EOF'
          <!-- Write user-facing release notes here before triggering release-trigger.yml.
               This file becomes the GitHub release body. Keep it concise and user-focused —
               what improved for kit users, not which files changed (kit/CHANGELOG.md tracks that).
               After the release workflow runs, this file resets automatically. -->
          RESET_EOF

          git add package.json kit/CHANGELOG.md RELEASE_NOTES.md
          git commit -m "chore: release ${VERSION}"
          git tag -a "$TAG" -m "Release $TAG"

          # Atomic: either main and the tag both update, or neither does.
          git push --atomic origin HEAD:main "refs/tags/$TAG"

      - name: Summary
        run: |
          echo "Released ${{ steps.version.outputs.version }}: one commit on main, tag ${{ steps.version.outputs.tag }} pushed."
