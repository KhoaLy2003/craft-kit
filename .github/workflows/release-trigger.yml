name: Release Trigger

# Bump version, update CHANGELOG, push tag, open PR.
# Triggers release.yml via the pushed tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3 or v1.2.3). Leave empty to auto-increment patch.'
        required: false
        type: string
      summary:
        description: 'One-line release summary (e.g. "Stack catalog · Bug fix workflow hardening"). Appears at the top of the release notes.'
        required: false
        type: string

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.2.0
        with:
          node-version: "22"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_VERSION" ]]; then
            # Strip optional v prefix
            VERSION="${INPUT_VERSION#v}"
            # Validate strict semver X.Y.Z
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Error: '$VERSION' is not valid semver (expected X.Y.Z)"
              exit 1
            fi
          else
            # Auto-increment patch from latest v* tag
            LATEST_TAG=$(git tag -l 'v*' --sort=-version:refname | head -n 1)
            if [[ -z "$LATEST_TAG" ]]; then
              LATEST_TAG="v0.0.0"
            fi
            echo "Latest tag: $LATEST_TAG"
            RAW="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$RAW"
            PATCH=$((PATCH + 1))
            VERSION="$MAJOR.$MINOR.$PATCH"
            echo "Auto-incremented version: $VERSION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check tag does not already exist
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Error: tag $TAG already exists."
            exit 1
          fi

      - name: Create release branch
        id: branch
        run: |
          BRANCH="chore/release-${{ steps.version.outputs.tag }}"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Update package.json version
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version
          echo "Updated package.json to ${{ steps.version.outputs.version }}"

      - name: Update kit/CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SUMMARY: ${{ github.event.inputs.summary }}
        run: |
          set -euo pipefail
          export DATE=$(date +%Y-%m-%d)

          node - << 'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const content = fs.readFileSync('kit/CHANGELOG.md', 'utf8');

          const version = process.env.VERSION;
          const date = process.env.DATE;
          const summary = (process.env.SUMMARY || '').trim();

          // Extract body of [Unreleased] (between its header and the next ## [ block)
          const unreleasedMatch = content.match(/^## \[Unreleased\]\n([\s\S]*?)(?=^## \[)/m);
          let unreleasedBody = '';
          if (unreleasedMatch) {
            // Strip the leading --- separator and surrounding whitespace
            unreleasedBody = unreleasedMatch[1].replace(/^[ \t]*---[ \t]*\n/, '').trim();
          }

          // Build versioned entry
          let versionBlock = `## [${version}] - ${date}\n`;
          if (summary) versionBlock += `\n**Summary:** ${summary}\n`;
          if (unreleasedBody) versionBlock += `\n${unreleasedBody}\n`;

          // Replace the [Unreleased] block with: fresh [Unreleased] + new version block
          const replacement = `## [Unreleased]\n\n---\n\n${versionBlock}\n---\n\n`;
          const updated = content.replace(
            /^## \[Unreleased\][\s\S]*?(?=^## \[)/m,
            replacement
          );

          if (updated === content) {
            console.error('ERROR: [Unreleased] section not found in kit/CHANGELOG.md');
            process.exit(1);
          }

          fs.writeFileSync('kit/CHANGELOG.md', updated);
          console.log(`CHANGELOG: promoted [Unreleased] → [${version}] - ${date}`);

          // Verify extraction matches what release.yml awk expects
          const out = execSync(
            `awk "/^## \\\\[${version}\\\\]/{found=1; next} found && /^## /{exit} found{print}" kit/CHANGELOG.md`
          ).toString().trim();
          if (!out) {
            console.error(`ERROR: awk extraction for [${version}] produced empty output — release.yml would fall back to commits.`);
            process.exit(1);
          }
          console.log(`Extraction check passed (${out.split('\n').length} lines).`);
          EOF

      - name: Commit version bump
        run: |
          git add package.json kit/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          fi

      - name: Push branch and tag
        run: |
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.branch.outputs.name }}"
          git push origin "${{ steps.version.outputs.tag }}"
          echo "Pushed branch ${{ steps.branch.outputs.name }} and tag ${{ steps.version.outputs.tag }}"

      - name: Reset RELEASE_NOTES.md for next release
        run: |
          cat > RELEASE_NOTES.md << 'RESET_EOF'
          <!-- Write user-facing release notes here before triggering release-trigger.yml.
               This file becomes the GitHub release body. Keep it concise and user-focused —
               what improved for kit users, not which files changed (kit/CHANGELOG.md tracks that).
               After the release workflow runs and the PR merges, this file resets automatically. -->
          RESET_EOF
          git add RELEASE_NOTES.md
          if git diff --cached --quiet; then
            echo "RELEASE_NOTES.md already at template state — nothing to commit."
          else
            git commit -m "chore: reset RELEASE_NOTES.md after ${{ steps.version.outputs.tag }}"
            git push origin "${{ steps.branch.outputs.name }}"
          fi


      - name: Open pull request
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.name }}" \
            --title "chore: release ${{ steps.version.outputs.version }}" \
            --body "Automated release of \`${{ steps.version.outputs.version }}\`.

          The git tag \`${{ steps.version.outputs.tag }}\` has been pushed and \`release.yml\` is building the GitHub Release.

          Merge this PR after the release is published to keep \`main\` in sync."

      - name: Summary
        run: |
          echo "Version bumped to ${{ steps.version.outputs.version }}"
          echo "Tag ${{ steps.version.outputs.tag }} pushed"
          echo "PR opened from ${{ steps.branch.outputs.name }} → main"
