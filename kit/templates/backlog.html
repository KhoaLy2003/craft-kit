<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PROJECT}} · backlog</title>
<style>
  :root { --bg:#fafafa; --fg:#1d1d1f; --muted:#6e6e73; --border:#d2d2d7; --card:#ffffff; --warn:#b26a00; --accent:#0a66c2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161618; --fg:#f5f5f7; --muted:#98989d; --border:#3a3a3c; --card:#1f1f22; --warn:#ffb340; --accent:#4da3ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .summary { color: var(--muted); margin-bottom: 24px; }
  .summary span { margin-right: 16px; }
  section.release { margin-bottom: 32px; }
  section.release h2 { font-size: 16px; margin: 0 0 12px; display: flex; gap: 8px; align-items: center; }
  .board { display: grid; grid-template-columns: repeat(4, minmax(180px, 1fr)); gap: 12px; overflow-x: auto; }
  .col { border: 1px solid var(--border); border-radius: 8px; padding: 10px; min-height: 80px; }
  .col h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .count { font-weight: normal; margin-left: 6px; }
  button.card { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
  button.card:hover, button.card:focus-visible { border-color: var(--accent); outline: none; }
  .card .id { font-size: 11px; color: var(--muted); }
  .card .name { font-weight: 600; margin: 2px 0 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { font-size: 12px; color: var(--muted); }
  .unverified { font-style: italic; color: var(--warn); }
  .badge { font-size: 11px; border: 1px solid var(--border); border-radius: 999px; padding: 0 6px; color: var(--muted); font-weight: normal; }
  .empty { color: var(--muted); font-size: 12px; margin: 0; }
  .muted { color: var(--muted); }
  dialog.detail { width: min(640px, calc(100% - 32px)); max-height: calc(100% - 32px); padding: 0; border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--fg); }
  dialog.detail::backdrop { background: rgba(0, 0, 0, .4); }
  .sheet { padding: 20px 22px; }
  .sheet h2 { font-size: 18px; margin: 4px 0 12px; overflow-wrap: anywhere; }
  .sheet h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 8px; }
  .sheet dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
  .sheet dt { color: var(--muted); }
  .sheet dd { margin: 0; }
  .sheet p.description { white-space: pre-line; margin: 0 0 12px; color: var(--muted); }
  ol.timeline { padding-left: 18px; margin: 0; }
  ol.timeline li { margin-bottom: 8px; }
  ol.timeline .note { color: var(--muted); font-size: 12px; }
  .close { margin-top: 16px; font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); cursor: pointer; }
  footer { color: var(--muted); font-size: 12px; margin-top: 32px; }
  @media (max-width: 800px) { .board { grid-template-columns: repeat(2, minmax(180px, 1fr)); } }
</style>
</head>
<body>
<header>
  <h1>{{PROJECT}} · backlog</h1>
  <div class="summary">{{SUMMARY}}</div>
</header>
<main>
{{BOARD}}
</main>
{{DIALOGS}}
<footer>Generated from docs/backlog.json by render-backlog.js. Do not edit this file by hand.</footer>
<script>
  (function () {
    document.querySelectorAll('[data-open]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.getElementById(btn.getAttribute('data-open')).showModal();
      });
    });
    // Clicking the backdrop (the dialog element itself, not its content) closes it.
    document.querySelectorAll('dialog.detail').forEach(function (dlg) {
      dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
    });
  })();
</script>
</body>
</html>
